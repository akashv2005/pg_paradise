<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            background-color: #E6E6E6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://www.decorpot.com/images/blogimage1361284108interior-designs-for-master-bedroom.jpg');
            background-size: cover;
        }

        .container {
            width: 50%;
            max-width: 600px;
            min-width: 300px;
        }

        .wrapper {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 25px;
            padding: 22px 0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
        }

        .img-div {
            flex: 0.7;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .form {
            flex: 1;
            margin-top: 20px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input {
            width: 80%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 25px;
            outline: none;
        }

        .btn-info {
            width: 85%;
            height: 50px;
            background-color: green;
            color: white;
            text-transform: uppercase;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="img-div">
                <img src="https://colorlib.com/etc/lf/Login_v1/images/img-01.png" alt="Logo" style="height:205px; width:230px">        
            </div>
            <form class="form" id="loginForm">
                <h2 style="color: white;">Member Login</h2>
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button class="btn-info" type="submit">Login</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault(); // Prevent page refresh

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Sample users for testing
            const users = [
                { id: 1, name: 'Akash Verma', role: 'tenant', email: 'akash@example.com', phone: '+91 98765XXXXX', profilePhoto: 'https://www.pngitem.com/pimgs/m/543-5431496_hotel-room-icon-clipart-png-download-hotel-room.png', username: 'akash', password: 'tenant123' },
                { id: 2, name: 'Rohit Sharma', role: 'landlord', email: 'rohit@example.com', phone: '+91 98765YYYYY', profilePhoto: 'https://www.pngitem.com/pimgs/m/543-5431496_hotel-room-icon-clipart-png-download-hotel-room.png', username: 'rohit', password: 'landlord123' }
            ];

            // Find the user in the list
            const user = users.find(u => u.username === username && u.password === password);

            if (user) {
                // Store user info in localStorage
                localStorage.setItem('user', JSON.stringify(user));

                // Redirect based on user role
                if (user.role === 'tenant') {
                    window.location.href = 'tenant_dashboard.html';
                } else if (user.role === 'landlord') {
                    window.location.href = 'landlord_dashboard.html';
                }
            } else {
                alert('Invalid username or password');
            }
        });
    </script>
</body>
</html>
